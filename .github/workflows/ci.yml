# SAST + SCA + functional self-check, on every push and every pull request.
# Reports are attached to each run as the "security-reports" artifact and also
# printed into the job log, which is what the README screenshots come from.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Security scans and self-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      # --- SAST: static analysis of our own code -------------------------
      # `tee` puts the full report into the job log as well as into the artifact.
      # With -o alone the log only shows bandit's own logging, and with -q the
      # "0 issues" summary disappears completely, leaving nothing to screenshot.
      - name: SAST - bandit
        run: |
          set -o pipefail
          bandit -r . -x ./.venv,./.tmp -f txt | tee bandit-report.txt

      # --- SCA: known vulnerabilities in third-party dependencies --------
      - name: SCA - pip-audit
        run: |
          set -o pipefail
          pip-audit -r requirements.txt -f columns | tee pip-audit-report.txt

      # --- the API still behaves correctly -------------------------------
      - name: Functional self-check
        run: python selfcheck.py

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            pip-audit-report.txt
          if-no-files-found: warn
